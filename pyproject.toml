[project]
name = "lawchat"
version = "0.4.0"
description = "Hybrid retrieval and RAG foundation for Vietnamese legal documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.0",
    "beautifulsoup4>=4.15.0",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.28.0",
    "httpx>=0.28.0",
    # Audit fix G4 (Phase 5): the next two dependencies are declared but
    # unused. Removing them would force a lock-file churn for downstream
    # deployments; instead we mark them as candidate-removal once the
    # Phase 4 ``expand_transitive`` rollout confirms we are not adopting
    # neo4j/langgraph as the production graph backend.
    "langgraph>=1.2.11",
    "lxml>=6.1.2",
    "mcp>=1.24.0,<2",
    "neo4j>=6.2.0",
    "polars>=1.43.2",
    "psycopg>=3.3.4",
    "psycopg-binary>=3.3.4",
    "pyarrow>=25.0.1",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=5.1.0",
    "sqlalchemy>=2.0.52",
    "tantivy>=0.26.0",
    "torch>=2.7.0",
    "uvicorn>=0.52.4",
    "argon2-cffi>=23.1,<26",
    "pyotp>=2.9,<3",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
    "streamlit>=1.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/api",
    "src/auth",
    "src/chat",
    "src/chunking",
    "src/cli",
    "src/config",
    "src/database",
    "src/evaluation",
    "src/indexing",
    "src/ingestion",
    "src/parsing",
    "src/preprocessing",
    "src/rag",
    "src/retrieval",
    "src/sources",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
