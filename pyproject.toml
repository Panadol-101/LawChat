[project]
name = "lawchat"
version = "0.4.0"
description = "Hybrid retrieval and RAG foundation for Vietnamese legal documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.0",
    "beautifulsoup4>=4.15.0",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.28.0",
    "httpx>=0.28.0",
    "langgraph>=1.2.11",
    "lxml>=6.1.2",
    "mcp>=1.24.0,<2",
    "neo4j>=6.2.0",
    "polars>=1.43.2",
    "psycopg>=3.3.4",
    "psycopg-binary>=3.3.4",
    "pyarrow>=25.0.1",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=5.1.0",
    "sqlalchemy>=2.0.52",
    "tantivy>=0.26.0",
    "torch>=2.7.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "streamlit>=1.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lawchat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
