services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-lawchat}"
      POSTGRES_USER: "${POSTGRES_USER:-lawchat}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-lawchat}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    restart: unless-stopped
    image: qdrant/qdrant:v1.19.0
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:-}"
    healthcheck:
      test:
        ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile
    network_mode: host
    command:
      ["sh", "-c", "alembic upgrade head && uvicorn api.main:app --host 127.0.0.1 --port 8000"]
    volumes:
      - type: bind
        source: "${EMBEDDING_CACHE_PATH:-./data/.cache/huggingface}"
        target: /app/data/.cache/huggingface
      # Tantivy acquires lockfiles while opening an index, including for search.
      # The application does not expose indexing operations, but the mount must
      # remain writable so startup can acquire those locks.
      - type: bind
        source: ./src
        target: /app/src
      - type: bind
        source: ./migrations
        target: /app/migrations
      - type: bind
        source: "${BM25_INDEX_ROOT:-./data/indexes/bm25}"
        target: /app/data/indexes/bm25
    environment:
      LAWCHAT_COOKIE_SECURE: "false"
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-lawchat}:${POSTGRES_PASSWORD:-lawchat}@127.0.0.1:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-lawchat}"
      QDRANT_URL: "http://127.0.0.1:${QDRANT_HTTP_PORT:-6333}"
      QDRANT_API_KEY: "${QDRANT_API_KEY:-}"
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-legal_chunks_bge_m3_1024_v1}"
      QDRANT_ALIAS: "${QDRANT_ALIAS:-legal_chunks_current}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-BAAI/bge-m3}"
      EMBEDDING_MODEL_REVISION: "${EMBEDDING_MODEL_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}"
      EMBEDDING_DIMENSION: "${EMBEDDING_DIMENSION:-1024}"
      EMBEDDING_MAX_LENGTH: "${EMBEDDING_MAX_LENGTH:-1200}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-1}"
      EMBEDDING_DEVICE: "${EMBEDDING_DEVICE:-cpu}"
      EMBEDDING_CACHE_PATH: "/app/data/.cache/huggingface"
      EMBEDDING_LOCAL_FILES_ONLY: "${EMBEDDING_LOCAL_FILES_ONLY:-false}"
      BM25_INDEX_ROOT: "/app/data/indexes/bm25"
      BM25_INDEX_ALIAS: "${BM25_INDEX_ALIAS:-legal_bm25_current}"
      RRF_K: "${RRF_K:-60}"
      RRF_DENSE_WEIGHT: "${RRF_DENSE_WEIGHT:-1.0}"
      RRF_SPARSE_WEIGHT: "${RRF_SPARSE_WEIGHT:-1.0}"
      RERANKER_ENABLED: "${RERANKER_ENABLED:-true}"
      RERANKER_MODEL: "${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}"
      RERANKER_DEVICE: "${RERANKER_DEVICE:-cpu}"
      RERANKER_CANDIDATES: "${RERANKER_CANDIDATES:-8}"
      RERANKER_BATCH_SIZE: "${RERANKER_BATCH_SIZE:-1}"
      RERANKER_MAX_LENGTH: "${RERANKER_MAX_LENGTH:-1536}"
      RERANKER_CACHE_PATH: "/app/data/.cache/huggingface"
      RERANKER_LOCAL_FILES_ONLY: "${RERANKER_LOCAL_FILES_ONLY:-true}"
      LAWCHAT_LLM_BASE_URL: "${LAWCHAT_LLM_BASE_URL:-http://127.0.0.1:11434/v1}"
      LAWCHAT_LLM_API_KEY: "${LAWCHAT_LLM_API_KEY:-ollama}"
      LAWCHAT_LLM_MODEL: "${LAWCHAT_LLM_MODEL:-}"
      LAWCHAT_LLM_TIMEOUT_SECONDS: "${LAWCHAT_LLM_TIMEOUT_SECONDS:-180}"
      LAWCHAT_LLM_CONTEXT_WINDOW: "${LAWCHAT_LLM_CONTEXT_WINDOW:-8192}"
      LAWCHAT_LLM_SYSTEM_PROMPT_TOKENS: "${LAWCHAT_LLM_SYSTEM_PROMPT_TOKENS:-1500}"
      LAWCHAT_LLM_ANSWER_RESERVE_TOKENS: "${LAWCHAT_LLM_ANSWER_RESERVE_TOKENS:-1500}"
      LAWCHAT_CONTEXT_MAX_EVIDENCE_TOTAL: "${LAWCHAT_CONTEXT_MAX_EVIDENCE_TOTAL:-12}"
      LAWCHAT_CONTEXT_MAX_EVIDENCE_PER_ISSUE: "${LAWCHAT_CONTEXT_MAX_EVIDENCE_PER_ISSUE:-3}"
      LAWCHAT_CONTEXT_MAX_GRAPH_EVIDENCE: "${LAWCHAT_CONTEXT_MAX_GRAPH_EVIDENCE:-2}"
      LAWCHAT_LLM_MAX_TOKENS: "${LAWCHAT_LLM_MAX_TOKENS:-1024}"
      LAWCHAT_LLM_REASONING_EFFORT: "${LAWCHAT_LLM_REASONING_EFFORT:-none}"
      LAWCHAT_LLM_RESPONSE_FORMAT: "${LAWCHAT_LLM_RESPONSE_FORMAT:-json_object}"
      LAWCHAT_LLM_ALLOW_FENCED_JSON: "${LAWCHAT_LLM_ALLOW_FENCED_JSON:-true}"
      LAWCHAT_SEMANTIC_MODE: "${LAWCHAT_SEMANTIC_MODE:-enforce}"
      LAWCHAT_SEMANTIC_MODEL: "${LAWCHAT_SEMANTIC_MODEL:-gemma4:31b-cloud}"
      LAWCHAT_SEMANTIC_SHADOW_MODEL: "${LAWCHAT_SEMANTIC_SHADOW_MODEL:-}"
      LAWCHAT_SEMANTIC_MAX_TOKENS: "${LAWCHAT_SEMANTIC_MAX_TOKENS:-3072}"
      LAWCHAT_SEMANTIC_TIMEOUT_SECONDS: "${LAWCHAT_SEMANTIC_TIMEOUT_SECONDS:-60}"
      LAWCHAT_SEMANTIC_CACHE_MAX_ENTRIES: "${LAWCHAT_SEMANTIC_CACHE_MAX_ENTRIES:-256}"
      LAWCHAT_SEMANTIC_CACHE_TTL_SECONDS: "${LAWCHAT_SEMANTIC_CACHE_TTL_SECONDS:-300}"
      LAWCHAT_EVIDENCE_VERSION: "${LAWCHAT_EVIDENCE_VERSION:-unversioned}"
      LAWCHAT_LLM_WARMUP_ENABLED: "${LAWCHAT_LLM_WARMUP_ENABLED:-false}"
      LAWCHAT_LEGAL_CUTOFF_DATE: "${LAWCHAT_LEGAL_CUTOFF_DATE:-2026-07-31}"
      LAWCHAT_ISSUE_MAX_TOKENS: "${LAWCHAT_ISSUE_MAX_TOKENS:-1024}"
      LAWCHAT_ISSUE_TIMEOUT_SECONDS: "${LAWCHAT_ISSUE_TIMEOUT_SECONDS:-60}"
      LAWCHAT_RAG_MAX_CONCURRENCY: "${LAWCHAT_RAG_MAX_CONCURRENCY:-1}"
      LAWCHAT_RAG_MAX_QUEUE: "${LAWCHAT_RAG_MAX_QUEUE:-4}"
      LAWCHAT_RAG_QUEUE_TIMEOUT_SECONDS: "${LAWCHAT_RAG_QUEUE_TIMEOUT_SECONDS:-10}"
      LAWCHAT_RAG_REQUEST_TIMEOUT_SECONDS: "${LAWCHAT_RAG_REQUEST_TIMEOUT_SECONDS:-300}"
      LAWCHAT_JSON_LOGS: "${LAWCHAT_JSON_LOGS:-true}"
      LAWCHAT_LOG_LEVEL: "${LAWCHAT_LOG_LEVEL:-INFO}"
      LAWCHAT_CORS_ORIGINS: "${LAWCHAT_CORS_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}"
      LAWCHAT_SOURCE_MCP_URL: "${LAWCHAT_SOURCE_MCP_URL:-}"
      LAWCHAT_SOURCE_MCP_TOOL: "${LAWCHAT_SOURCE_MCP_TOOL:-google_search}"
      LAWCHAT_SOURCE_MCP_API_KEY: "${LAWCHAT_SOURCE_MCP_API_KEY:-}"
      LAWCHAT_SOURCE_MCP_TIMEOUT_SECONDS: "${LAWCHAT_SOURCE_MCP_TIMEOUT_SECONDS:-20}"
      LAWCHAT_SOURCE_CACHE_DAYS: "${LAWCHAT_SOURCE_CACHE_DAYS:-30}"
      LAWCHAT_SOURCE_OFFICIAL_DOMAINS: "${LAWCHAT_SOURCE_OFFICIAL_DOMAINS:-vbpl.vn,congbao.chinhphu.vn,vanban.chinhphu.vn,moj.gov.vn}"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  source-mcp:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile
    network_mode: host
    command: ["python", "-m", "sources.mcp_server"]
    environment:
      PYTHONUNBUFFERED: "1"
      SERPAPI_API_KEY: "${SERPAPI_API_KEY:-}"
      LAWCHAT_SOURCE_MCP_BIND_HOST: "${LAWCHAT_SOURCE_MCP_BIND_HOST:-127.0.0.1}"
      LAWCHAT_SOURCE_MCP_PORT: "${LAWCHAT_SOURCE_MCP_PORT:-8010}"
      LAWCHAT_SOURCE_MCP_TIMEOUT_SECONDS: "${LAWCHAT_SOURCE_MCP_TIMEOUT_SECONDS:-20}"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('127.0.0.1', 8010)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
    network_mode: host
    command:
      ["streamlit", "run", "frontend/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    environment:
      PYTHONUNBUFFERED: "1"
      LAWCHAT_API_BASE_URL: "${LAWCHAT_API_BASE_URL:-http://127.0.0.1:8000}"
      LAWCHAT_PUBLIC_BASE_URL: "${LAWCHAT_PUBLIC_BASE_URL:-http://localhost:8501}"
      LAWCHAT_PUBLIC_API_BASE_URL: "${LAWCHAT_PUBLIC_API_BASE_URL:-http://localhost:8000}"
      LAWCHAT_WORKSPACE_ID: "${LAWCHAT_WORKSPACE_ID:-local}"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  admin-frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
    network_mode: host
    command:
      ["streamlit", "run", "frontend/admin/app.py", "--server.address", "127.0.0.1", "--server.port", "8502", "--server.headless", "true"]
    environment:
      PYTHONUNBUFFERED: "1"
      LAWCHAT_API_BASE_URL: "${LAWCHAT_API_BASE_URL:-http://127.0.0.1:8000}"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8502/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  qdrant_data:
